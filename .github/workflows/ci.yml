name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build artifacts
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-node24-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Run ESLint
        run: pnpm lint

      - name: Strict TypeScript Check
        run: pnpm typecheck

      - name: Run Test Suite (with Coverage Gate)
        run: pnpm test:coverage

      - name: Upload coverage scope report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Run Production Build
        run: NAVELIX_DATA_DIR="$(mktemp -d)" pnpm build

  e2e:
    name: Playwright E2E (Core UI Flow)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Core Flow
        run: pnpm test:e2e

      - name: Upload Playwright Report (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  container-smoke:
    name: CE container smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build CE image without publishing
        run: docker build -t navelix-ci .
      - name: Start isolated container
        run: docker run -d --name navelix-ci -p 127.0.0.1:3721:3721 -e NAVELIX_ADMIN_PASSWORD=ci-test-password navelix-ci
      - name: Verify runtime and API behavior
        run: |
          node scripts/smoke-container.mjs
          test "$(docker exec navelix-ci whoami)" != root
          docker exec navelix-ci test -w /app/data
          test "$(docker exec navelix-ci find /app -name '*.ts' | wc -l)" -eq 0
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs navelix-ci || true
          docker rm -f navelix-ci || true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c1b" />
      <stop offset="50%" stop-color="#00663d" />
      <stop offset="100%" stop-color="#00C776" />
    </linearGradient>

    <!-- Metallic Emerald Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55ffb2" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00C776" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Core Element Gradient -->
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ccffea" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C776" />
      <stop offset="100%" stop-color="#3bf79e" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00C776" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#005432" flood-opacity="0.3" />
    </filter>

    <filter id="sparkle-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Shield Container -->
  <rect x="16" y="16" width="224" height="224" rx="64" fill="url(#bg-grad)" filter="url(#glow)" />
  <rect x="16" y="16" width="224" height="224" rx="64" fill="none" stroke="url(#border-grad)" stroke-width="3.5" />

  <!-- Outer Orbital Compass Grid Ring -->
  <circle cx="128" cy="128" r="92" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="4 6" />
  <circle cx="128" cy="128" r="76" stroke="#00C776" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- 4 Cardinal Directional Radar Nodes -->
  <circle cx="128" cy="36" r="3" fill="#3bf79e" />
  <circle cx="220" cy="128" r="3" fill="#3bf79e" />
  <circle cx="128" cy="220" r="3" fill="#3bf79e" />
  <circle cx="36" cy="128" r="3" fill="#3bf79e" />

  <!-- Outer Crosshairs -->
  <line x1="128" y1="26" x2="128" y2="46" stroke="#3bf79e" stroke-width="2" stroke-linecap="round" />
  <line x1="210" y1="128" x2="230" y2="128" stroke="#3bf79e" stroke-width="2" stroke-linecap="round" />
  <line x1="128" y1="210" x2="128" y2="230" stroke="#3bf79e" stroke-width="2" stroke-linecap="round" />
  <line x1="26" y1="128" x2="46" y2="128" stroke="#3bf79e" stroke-width="2" stroke-linecap="round" />

  <!-- Center Interwoven Digital 'N' & Hub Core Structure -->
  <g transform="translate(68, 68)">
    <!-- Interconnecting Backbone Rays -->
    <path d="M 12,108 L 108,12" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-dasharray="3 3" />

    <!-- 3D Layered Geometric 'N' Ribbon -->
    <!-- Left Vertical Stem -->
    <path d="M 16,104 V 24 C 16,19.5 19.5,16 24,16 H 28 C 32.5,16 36,19.5 36,24 V 104 C 36,108.5 32.5,112 28,112 H 24 C 19.5,112 16,108.5 16,104 Z" fill="url(#core-grad)" />

    <!-- Right Vertical Stem -->
    <path d="M 84,104 V 24 C 84,19.5 87.5,16 92,16 H 96 C 100.5,16 104,19.5 104,24 V 104 C 104,108.5 100.5,112 96,112 H 92 C 87.5,112 84,108.5 84,104 Z" fill="url(#core-grad)" />

    <!-- Diagonal Dynamic Connector Strip -->
    <path d="M 26,20 L 94,100 C 97,103.5 102,103.5 105,100 L 105,92 C 105,88.5 100,83.5 97,80 L 29,4 C 26,0.5 21,0.5 18,4 L 18,12 C 18,15.5 23,20.5 26,20 Z" fill="url(#accent-grad)" opacity="0.95" />

    <!-- Hub Node Spheres -->
    <circle cx="26" cy="24" r="9" fill="#ffffff" filter="url(#sparkle-glow)" />
    <circle cx="26" cy="24" r="4" fill="#00C776" />

    <circle cx="98" cy="104" r="9" fill="#ffffff" filter="url(#sparkle-glow)" />
    <circle cx="98" cy="104" r="4" fill="#00C776" />

    <circle cx="26" cy="104" r="8" fill="#ffffff" />
    <circle cx="98" cy="24" r="8" fill="#ffffff" />

    <!-- Central AI Quad-Sparkle Core -->
    <g transform="translate(62, 62)">
      <path d="M 0,-14 C 1,-5 5,-1 14,0 C 5,1 1,5 0,14 C -1,5 -5,1 -14,0 C -5,-1 -1,-5 0,-14 Z" fill="#ffffff" filter="url(#sparkle-glow)" />
      <circle cx="0" cy="0" r="3" fill="#00C776" />
    </g>
  </g>
</svg>

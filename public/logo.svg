<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Alvin Lustig Signature Aesthetic: Pure White Background Container -->
  <rect width="256" height="256" rx="56" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" />

  <!-- Mid-Century Modern Organic & Geometric Composition -->
  <g transform="translate(28, 28)">
    <!-- Floating Organic Steam Lines -->
    <path
      d="M 65 30 C 60 15, 75 5, 70 -5"
      stroke="#1E293B"
      stroke-width="7"
      stroke-linecap="round"
    />
    <path
      d="M 100 35 C 95 18, 110 8, 105 -2"
      stroke="#00C776"
      stroke-width="7"
      stroke-linecap="round"
    />
    <path
      d="M 135 30 C 130 15, 145 5, 140 -5"
      stroke="#D97706"
      stroke-width="7"
      stroke-linecap="round"
    />

    <!-- Minimalist Flat Coffee Cup Silhouette -->
    <path
      d="M 45 60 H 155 L 142 145 C 140 158, 128 168, 114 168 H 86 C 72 168, 60 158, 58 145 Z"
      fill="#1E293B"
    />

    <!-- Cup Handle Ring -->
    <path
      d="M 152 75 C 178 75, 178 130, 147 130"
      stroke="#1E293B"
      stroke-width="12"
      stroke-linecap="round"
    />

    <!-- Organic Coffee Bean Core Cutout -->
    <g transform="translate(100, 114)">
      <path
        d="M -18 -26 C -38 -15, -38 15, -18 26 C -5 32, 10 18, 0 0 C 10 -18, -5 -32, -18 -26 Z"
        fill="#00C776"
      />
      <path
        d="M 18 -26 C 38 -15, 38 15, 18 26 C 5 32, -10 18, 0 0 C -10 -18, 5 -32, 18 -26 Z"
        fill="#D97706"
      />
      <path
        d="M 0 -28 C -8 -10, 8 10, 0 28"
        stroke="#FFFFFF"
        stroke-width="4"
        stroke-linecap="round"
      />
    </g>
  </g>
</svg>
